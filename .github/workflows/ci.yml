# INTEGRAÇÃO CONTÍNUA DO TROPI
# Roda a cada push e a cada pull request:
#   1. checks: tipos (TypeScript), lint (ESLint) e testes de unidade (regras do core e canais)
#   2. e2e:    sobe um PostgreSQL só para testes, migra, carrega a demonstração, compila o app
#              e roda os testes de ponta a ponta (Playwright) no Chromium.
# Se algo falhar no e2e, o relatório (com fotos e "trace" de cada passo) fica em
# Actions > execução > Artifacts > playwright-report.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo branch cancela a execução anterior (economiza minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tipos, lint e testes de unidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      # Banco SÓ de testes (o preparo recusa nomes sem _e2e/_test)
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:54320/ecosaude_e2e
      DATABASE_URL: postgres://postgres:postgres@localhost:54320/ecosaude_e2e
      # Chaves de mentira, válidas só neste ambiente de testes
      TOTP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      LGPD_HASH_SECRET: ci-lgpd-secret
      CRON_SECRET: ci-cron
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Navegador do Playwright (com cache entre execuções)
      - name: Versão do Playwright
        id: pw
        run: echo "version=$(pnpm --filter @ecosaude/app exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Instalar Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ecosaude/app exec playwright install --with-deps chromium
      - name: Dependências do sistema do Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ecosaude/app exec playwright install-deps chromium

      - name: Preparar banco de testes (migrações + demonstração)
        run: pnpm test:e2e:prepare
      - name: Compilar o app
        run: pnpm turbo run build --filter=@ecosaude/app
      - name: Testes de ponta a ponta
        run: pnpm test:e2e
      - name: Compilar o site
        if: ${{ !cancelled() }}
        run: pnpm turbo run build --filter=@ecosaude/site
      - name: Testes da landing page
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:site

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/app/e2e/playwright-report/
            apps/app/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
